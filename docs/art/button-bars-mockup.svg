<rect x="350" y="632" width="200" height="30" fill="#21262d" stroke="#2b3440"/>
<text x="362" y="652" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Share</text>
<rect x="350" y="666" width="200" height="30" fill="#21262d" stroke="#2b3440"/>
<text x="362" y="686" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Share as GW1 code</text>
<rect x="350" y="700" width="200" height="30" fill="#21262d" stroke="#2b3440"/>
<text x="362" y="720" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Duplicate</text>
<rect x="350" y="734" width="200" height="30" fill="#21262d" stroke="#2b3440"/>
<text x="362" y="754" fill="#ff7b72" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Delete</text>
<text x="20" y="820" fill="#59c2ff" font-size="13" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Edge cases</text>
<text x="20" y="846" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">• Invalid team: Save is disabled, its tooltip gives the reason, you stay on the screen (the red chip lists the problems).</text>
<text x="20" y="868" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">• Esc and the browser's back button leave exactly as today (unsaved-changes handling unchanged).</text>
<text x="20" y="890" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">• Phone width: crumbs shrink to the place name; Save and ⋯ stay visible on the right.</text>
</svg>
