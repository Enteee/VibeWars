<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940">
<rect width="1000" height="940" fill="#0e1116"/>
<text x="20" y="34" fill="#d7dee8" font-size="18" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">#1902 mockup: one button bar for the Team Builder and the Character Builder</text>
<text x="20" y="70" fill="#59c2ff" font-size="13" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">TODAY</text>
<text x="20" y="92" fill="#d7dee8" font-size="15" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Team Builder (editing a team)</text>
<rect x="0" y="104" width="1000" height="44" fill="#161b22"/>
<line x1="0" y1="148" x2="1000" y2="148" stroke="#2b3440"/>
<text x="16" y="131" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">VibeWars / Team Builder / Edit</text>
<rect x="250" y="111" width="76" height="30" rx="4" fill="#21262d" stroke="#2b3440"/>
<text x="288" y="131" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="middle" font-family="DejaVu Sans, sans-serif">‹ Back</text>
<text x="334" y="131" fill="#ff7b72" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">2 problems</text>
<text x="418" y="131" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">● unsaved</text>
