<text x="950" y="131" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Delete</text>
<text x="20" y="168" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Save stays on the screen; Back leaves. Share / Duplicate / Delete are loose buttons.</text>
<text x="20" y="198" fill="#d7dee8" font-size="15" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Character Builder</text>
<rect x="0" y="210" width="1000" height="44" fill="#161b22"/>
<line x1="0" y1="254" x2="1000" y2="254" stroke="#2b3440"/>
<text x="16" y="237" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">VibeWars / Kestrel</text>
