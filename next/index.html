<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>VibeWars</title>
    <meta
      name="description"
      content="Team arena PvP in the browser. Build a character, send your friends a link, fight in real time. Nothing to install."
    />
    <!-- Link preview. og:url, og:image and twitter:image are added at build (plugins/site-meta.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VibeWars" />
    <meta property="og:title" content="VibeWars" />
    <meta
      property="og:description"
      content="Team arena PvP in the browser. Build a character, send your friends a link, fight in real time. Nothing to install."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The VibeWars title over a lit arena where two teams fight."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Vite copies `public/` to the dist root, which the server then serves. -->
    <link rel="icon" type="image/svg+xml" href="/VibeWars/next/icon.svg" />
    <script type="module" crossorigin src="/VibeWars/next/assets/main-CCneJpmU.js"></script>
    <link rel="modulepreload" crossorigin href="/VibeWars/next/assets/preload-helper-C0TE3cvU.js">
    <link rel="modulepreload" crossorigin href="/VibeWars/next/assets/dist-CLJqS3v_.js">
    <link rel="modulepreload" crossorigin href="/VibeWars/next/assets/arena-snapshot-Bhft7w_W.js">
    <link rel="modulepreload" crossorigin href="/VibeWars/next/assets/music-urls-BTfPk6v3.js">
    <link rel="stylesheet" crossorigin href="/VibeWars/next/assets/main-BospWopp.css">
    <meta property="og:url" content="https://enteee.github.io/VibeWars/next/" />
    <meta property="og:image" content="https://enteee.github.io/VibeWars/next/share.png" />
    <meta name="twitter:image" content="https://enteee.github.io/VibeWars/next/share.png" />
  </head>
  <body>
    <!-- The menu background's fight (#3119): behind the screens, no input. -->
    <div id="menu-background" aria-hidden="true"></div>
    <div id="app">
      <!-- The shown screen's place and controls, then the global icons (#1272). -->
      <header id="topbar">
        <nav class="topbar-crumbs" aria-label="Where you are">
          <span class="topbar-crumb is-place">VibeWars</span>
        </nav>
        <span class="topbar-back"></span>
        <span class="topbar-status"></span>
        <span id="status" class="status" hidden></span>
        <div class="topbar-tools">
          <div class="topbar-screen-actions"></div>
          <div class="topbar-queue-action"></div>
          <div id="topbar-actions" class="topbar-actions"></div>
        </div>
      </header>
      <!-- Menu / character / team / lobby screens. -->
      <div id="screens"></div>
      <!-- The Phaser game viewport; shown only during a match. -->
      <main id="viewport" aria-label="Game viewport"></main>
    </div>
  </body>
</html>
