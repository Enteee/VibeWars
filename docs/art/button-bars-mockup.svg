<text x="205.6" y="237" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="middle" font-family="DejaVu Sans, sans-serif">‹ Close</text>
<text x="255.6" y="237" fill="#d7dee8" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Ranger / Monk</text>
<text x="360.6" y="237" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">38/200</text>
<text x="416.6" y="237" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">● unsaved</text>
<rect x="884" y="217" width="60" height="30" rx="4" fill="#59c2ff" stroke="#59c2ff"/>
<text x="914" y="237" fill="#0e1116" font-size="13" font-weight="700" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Save</text>
<rect x="952" y="217" width="36" height="30" rx="4" fill="#21262d" stroke="#2b3440"/>
<text x="970" y="237" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="middle" font-family="DejaVu Sans, sans-serif">⋯</text>
<text x="20" y="274" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Save stays on the screen; Close leaves. Share / Duplicate / Delete are behind ⋯.</text>
<text x="20" y="330" fill="#59c2ff" font-size="13" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">PROPOSED (same bar on both screens)</text>
<text x="20" y="352" fill="#d7dee8" font-size="15" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Team Builder</text>
<rect x="0" y="364" width="1000" height="44" fill="#161b22"/>
<line x1="0" y1="408" x2="1000" y2="408" stroke="#2b3440"/>
<text x="16" y="391" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">VibeWars / Team Builder / Edit</text>
<text x="250" y="391" fill="#ff7b72" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">2 problems</text>
<text x="334" y="391" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">● unsaved</text>
<rect x="884" y="371" width="60" height="30" rx="4" fill="#59c2ff" stroke="#59c2ff"/>
<text x="914" y="391" fill="#0e1116" font-size="13" font-weight="700" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Save</text>
<rect x="952" y="371" width="36" height="30" rx="4" fill="#21262d" stroke="#2b3440"/>
<text x="970" y="391" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="middle" font-family="DejaVu Sans, sans-serif">⋯</text>
<text x="20" y="428" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">No Back. Save stores the team and returns to the screen you came from.</text>
<text x="20" y="458" fill="#d7dee8" font-size="15" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Character Builder</text>
<rect x="0" y="470" width="1000" height="44" fill="#161b22"/>
<line x1="0" y1="514" x2="1000" y2="514" stroke="#2b3440"/>
<text x="16" y="497" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">VibeWars / Kestrel</text>
<text x="163.6" y="497" fill="#d7dee8" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Ranger / Monk</text>
<text x="268.6" y="497" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">38/200</text>
<text x="324.6" y="497" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">● unsaved</text>
<rect x="884" y="477" width="60" height="30" rx="4" fill="#59c2ff" stroke="#59c2ff"/>
<text x="914" y="497" fill="#0e1116" font-size="13" font-weight="700" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Save</text>
<rect x="952" y="477" width="36" height="30" rx="4" fill="#21262d" stroke="#2b3440"/>
<text x="970" y="497" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="middle" font-family="DejaVu Sans, sans-serif">⋯</text>
<text x="20" y="534" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Same bar: crumbs and status left, Save then ⋯ right.</text>
<text x="20" y="552" fill="#7d8899" font-size="12" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">(Its Close is not in #1902's scope; dropped here only to show the aligned shape. Say if it should stay.)</text>
<text x="20" y="590" fill="#59c2ff" font-size="13" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">THE ⋯ MENU (same place on both screens)</text>
<text x="20" y="620" fill="#d7dee8" font-size="13" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Team Builder ⋯</text>
<rect x="20" y="632" width="200" height="30" fill="#21262d" stroke="#2b3440"/>
<text x="32" y="652" fill="#d7dee8" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Share</text>
