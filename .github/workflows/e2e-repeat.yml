name: e2e repeat

# Repeats the e2e specs a pull request adds or changes, ten times, and fails
# on any failure (#216). A `plan` job packs whole specs into jobs (#1566),
# so every spec gets exactly ten runs across the jobs and a job holds about
# 1500 s of runs (#1884): the plan weighs each spec by its seconds in
# scripts/ci/e2e-durations.json, so a job runs ~25 min plus setup, inside the
# 40-minute cap, and at most 6 jobs wait on runners. A PR too big for 6
# jobs (a spec over ~750 s cannot repeat ten times in 6) fails `plan` with a refusal instead of timing out. Playwright's own
# --shard is not used: it splits by test count and can leave a shard empty.
# A 1-in-10 flake survives ten runs 35% of the time, so qa-tester's
# flake-check skill stays: this is the floor, not a replacement.
#
# Its own workflow, not a job in ci.yml: the merge guard reads ci.yml's
# pull_request job conclusions (#123). Not in EXPECTED_CHECKS and not in the
# ruleset, but hubd still refuses a merge unless every job of this workflow's
# pull_request run succeeded (EVERY_JOB_WORKFLOWS in hubd.mjs), so a red run
# here blocks a merge until the flake is fixed. That is the point.
#
# Pull requests that touch a spec only: a PR with no spec change starts no
# run, and hubd counts a head with no run of this workflow as satisfied
# (judgingRuns `optional`, #1884). If every spec it touched was deleted, the
# plan is empty and the job is skipped, which hubd also accepts.

on:
  pull_request:
    paths: ["e2e/**/*.spec.ts"]

permissions:
  contents: read

# A newer push cancels the run it supersedes (#230).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which specs, packed into which jobs. Cheap: no build.
  plan:
    name: plan
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.select.outputs.specs }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The merge base with the pull request's base must be present.
          fetch-depth: 0

      # Only the specs the pull request adds, modifies or renames (with or
      # without edits, #430); deleted ones are left out. A helper or
      # playwright.config.ts change does not widen the run: the whole suite
      # ten times would go red on background flakes the change did not write,
      # and ci.yml's `e2e` job already runs it once.
      - id: select
        name: Select specs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          specs=$(node scripts/ci/select-e2e-specs.mjs "$BASE")
          if [ -z "$specs" ]; then
            echo "no e2e specs changed"
          else
            echo "Repeating: $specs"
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

      # Packs the specs into jobs; refuses a PR too big for the budget.
      - id: plan
        name: Plan jobs
        env:
          SPECS: ${{ steps.select.outputs.specs }}
        run: |
          # shellcheck disable=SC2086
          matrix=$(node scripts/ci/select-e2e-specs.mjs --plan $SPECS)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e-repeat:
    name: e2e-repeat (${{ matrix.job }})
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    # Company runners when the job is trusted to run there, GitHub's otherwise
    # (ADR-0045). An event allowlist, fail-closed: any event not named here,
    # such as pull_request_target or workflow_run, runs hosted. The events
    # equal scripts/bots/runner-events.json, which the job-started hook
    # enforces; scripts/ci/runs-on.test.mjs holds the text identical in every
    # workflow. A fork PR can rewrite this line in its own copy, so this does
    # not stop it: that hook fails the job, and the outside-contributor
    # approval setting stops it earlier.
    runs-on: ${{ (vars.COMPANY_RUNNERS == '1' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","vibewars-company"]') || 'ubuntu-latest' }}
    strategy:
      # One failing job is the answer; the others add nothing but cost.
      fail-fast: true
      # One entry per job: { job, specs, repeat }, from the plan job.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Two runs of a few specs take minutes. Without a cap, a hang would sit
    # pending for six hours, and hubd blocks the merge while it does.
    timeout-minutes: 40
    env:
      SPECS: ${{ matrix.specs }}
      REPEAT: ${{ matrix.repeat }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/devenv

      # e2e serves the built client, as in ci.yml's e2e job.
      - name: Build
        run: devenv shell -- pnpm run build

      - name: Repeat specs
        # SPECS is split on spaces on purpose: one argument per spec.
        run: |
          # shellcheck disable=SC2086
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-repeat.json devenv shell -- pnpm exec playwright test $SPECS \
            --reporter=list,json --repeat-each="$REPEAT" --retries=0 --workers=1
          # A pass that ran nothing (every test skipped) is not a pass.
          node scripts/ci/select-e2e-specs.mjs --assert-ran e2e-repeat.json

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-repeat-output-${{ matrix.job }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
