name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes, so stale runs
# stop holding runners other pull requests are queued for. Main is keyed on
# the commit, not the ref: a concurrency group keeps only one pending run, so
# a ref-keyed group would silently drop the run of an intermediate merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every check runs inside the dev shell devenv.nix defines, with the toolchain
# devenv.lock pins: there is no second toolchain setup to drift from it. See
# docs/adr/0021-ci-in-devenv.md.
jobs:
  # Every hook in one job (#230): the shell is realised once, not once per
  # hook. prek runs every hook even after one fails and names each one
  # Passed or Failed in the log. The hooks are read from the
  # .pre-commit-config.yaml the shell generates, so adding one to
  # `git-hooks.hooks` in devenv.nix runs it here with no edit.
  # The job name is a required check (company-init.mjs EXPECTED_CHECKS).
  # No `needs:`, for the reason given on `ci`.
  hooks:
    name: git hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The one job that saves the Nix store cache; the others restore it.
      - uses: ./.github/actions/devenv
        with:
          save-cache: "true"

      # An empty hook list would pass `prek run` vacuously. Asks prek, the
      # runner itself, rather than parsing the file. Written to a file
      # because the shell's own greeting also goes to stdout.
      - name: List enabled hooks
        run: |
          devenv shell -- bash -c \
            "prek list -c .pre-commit-config.yaml --output-format json > '$RUNNER_TEMP/hooks.json'"
          hooks=$(jq -c '[.[].id]' "$RUNNER_TEMP/hooks.json")
          echo "Hooks: $hooks"
          if [ "$(jq length <<<"$hooks")" -eq 0 ]; then
            echo "::error::.pre-commit-config.yaml lists no hooks"
            exit 1
          fi

      # Against the whole tree, not only changed files: a commit made with
      # --no-verify, or outside the shell, is caught here.
      # The hooks run in sequence on one checkout, so a fixer (prettier,
      # nixfmt) that rewrites a file shows later hooks the fixed file.
      # Accepted: prek exits non-zero whenever a fixer changed anything, so
      # the job still fails, and --show-diff-on-failure prints the fix.
      - name: Run every hook on every file
        run: >-
          devenv shell --
          prek run --all-files --show-diff-on-failure
          -c .pre-commit-config.yaml

  # The job name is the required status check (scripts/bots/company-init.mjs
  # EXPECTED_CHECKS), so it stays as it is.
  # No `needs:` on purpose: a required check whose dependency failed is
  # reported as skipped, and a skipped required check counts as passing.
  ci:
    name: format + lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/devenv

      # Mirrors `enterTest` in devenv.nix, less e2e, which is the `e2e` job
      # below; keep the lists in step. They run as discrete steps, not one
      # `devenv test`, so a failure's exact stage is visible directly in the
      # Actions UI. The order is enterTest's: `pnpm run lint` builds the
      # declarations type-aware linting needs itself.
      - name: Format check
        run: devenv shell -- pnpm run format:check

      - name: Lint
        run: devenv shell -- pnpm run lint

      - name: Typecheck
        run: devenv shell -- pnpm run typecheck

      - name: Test
        run: devenv shell -- pnpm run test

      - name: Build
        run: devenv shell -- pnpm run build

      # No package version younger than a week, and no git/tarball/URL
      # resolution, may enter pnpm-lock.yaml
      # (#107), even if the author overrode minimumReleaseAge or
      # blockExoticSubdeps on the command line for a
      # one-off add. Pull requests only: main has no base to diff against.
      - name: Lockfile age
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:pnpm-lock.yaml" > "$RUNNER_TEMP/base-lock.yaml"
          devenv shell -- node scripts/ci/lockfile-age.mjs "$RUNNER_TEMP/base-lock.yaml" pnpm-lock.yaml

  # The `e2e` check (EXPECTED_CHECKS, #132) is the aggregate below; the work
  # is spread over four shards (#1610) so a pull request waits one quarter of
  # the suite. Each shard builds for itself: the build is a small part of the
  # run, and sharing it would add an artifact round trip and a `needs:`.
  # The shard has no `name:` on purpose: hub-guards.test.mjs ties every named
  # job to EXPECTED_CHECKS, and only the aggregate is a required check.
  # No path filter, for the reason given on `ci`: a required check that is
  # skipped, or never reports, must not count as green.
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Full e2e on every main push is what catches two pull requests that are
    # green alone and red together (#1571), but it need not run for every
    # merge: at most one run per shard and one pending, always the newest main.
    # A pending run replaced by a newer push concludes cancelled, so a red main
    # e2e covers the merges since the last green one (#1620). A pull request
    # gets a group of its own and is never coalesced.
    concurrency:
      group: ${{ github.event_name == 'push' && format('e2e-main-{0}', matrix.shard) || format('e2e-{0}-{1}', github.run_id, matrix.shard) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # An asset-only pull request skips the work below, but the job still
      # reports (#1609). main always runs everything, and so does a diff that
      # fails: scripts/ci/e2e-needed.mjs fails closed, and only an explicit
      # "false" skips. The checkout is the
      # merge commit, so its diff against the base tip is the pull request.
      - name: Is e2e needed
        id: needed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          needed=true
          if [ "$EVENT" = pull_request ] && git fetch --no-tags --depth=1 origin "$BASE_REF"; then
            # The base's copy of the matcher, not the pull request's own: a PR
            # must not be able to edit its way out of its e2e.
            git show FETCH_HEAD:scripts/ci/e2e-needed.mjs > "$RUNNER_TEMP/e2e-needed.mjs" 2>/dev/null &&
              needed=$(node "$RUNNER_TEMP/e2e-needed.mjs" FETCH_HEAD HEAD 2>/dev/null) || needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/devenv
        if: steps.needed.outputs.needed != 'false'

      # e2e serves the built client.
      - name: Build
        if: steps.needed.outputs.needed != 'false'
        run: devenv shell -- pnpm run build

      # Drives the Chromium the shell pins (VIBEWARS_CHROMIUM), so there is
      # no `playwright install`.
      - name: End-to-end tests
        if: steps.needed.outputs.needed != 'false'
        run: devenv shell -- pnpm run test:e2e --shard=${{ matrix.shard }}/4

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-output-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Green only if every shard succeeded. A cancelled or skipped shard is a
  # failure here (an asset-only skip still runs the shards, which succeed).
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard succeeded
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard: $RESULT"
          [ "$RESULT" = success ]
