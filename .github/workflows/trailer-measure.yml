name: TrailerMeasure
on:
  push:
    branches: ["bot/cicd-engineer@2/trailer-smooth"]
permissions:
  contents: read
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        v: [base, small, gpuflags, novideo]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/devenv
      - run: devenv shell -- pnpm -r --filter "./packages/**" run build
      - run: |
          mkdir -p ~/.cache/ms-playwright/ffmpeg-1011
          ln -sf "$(devenv shell -- which ffmpeg | tail -n 1)" ~/.cache/ms-playwright/ffmpeg-1011/ffmpeg-linux
      - name: variant
        env:
          V: ${{ matrix.v }}
        run: |
          f=scripts/promo/capture.mjs
          case "$V" in
            small) sed -i 's/width: 1920, height: 1080/width: 1280, height: 720/' $f ;;
            gpuflags) sed -i 's|args: \["--no-sandbox",|args: ["--no-sandbox", "--use-angle=swiftshader", "--enable-unsafe-swiftshader", "--ignore-gpu-blocklist", "--enable-gpu-rasterization",|' $f ;;
            novideo) sed -i '/recordVideo:/d' $f ;;
          esac
          git diff --stat
      - run: devenv shell -- node scripts/promo/capture.mjs --scene map-ember-pits 2>&1 | grep -E "frame intervals|failed|rror" | head
