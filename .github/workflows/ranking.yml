name: Ranking

# Hourly leaderboard (#3574, ADR-0055): reads ranked-match receipts from the
# relays, merges them into the archive kept on gh-pages under ranking/, and
# publishes ranking/leaderboard.json beside the site.
#
# Two jobs, as in pages.yml, so the write token never meets repository code:
# `build` runs scripts/ranking/build.mjs with a read-only token that is not
# persisted; `publish` holds contents: write and runs nothing but this file's
# shell over the built artifact.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/devenv

      # The repository is public: the archive is read without a token.
      - name: Fetch the archive
        run: |
          mkdir -p ranking-out
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q --depth 1 origin gh-pages
            if git cat-file -e FETCH_HEAD:ranking 2>/dev/null; then
              git archive FETCH_HEAD ranking | tar -x --strip-components=1 -C ranking-out
            fi
          fi
          ls -la ranking-out

      - name: Build the leaderboard
        run: |
          devenv shell -- pnpm --filter @vibewars/ranking build
          devenv shell -- pnpm ranking:build --archive ranking-out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ranking
          path: |
            ranking-out/receipts.ndjson
            ranking-out/leaderboard.json
            ranking-out/log.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The same group as pages.yml's next and release deploys: one writer to
    # gh-pages at a time, queued and never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ranking
          path: ${{ runner.temp }}/ranking

      - name: Publish ranking/ to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"

          remote="https://github.com/$GITHUB_REPOSITORY.git"
          site="$RUNNER_TEMP/site"

          # An rc deploy runs beside this job, so gh-pages can move between
          # the fetch and the push: start over then.
          for attempt in 1 2 3; do
            cd "$RUNNER_TEMP"
            rm -rf "$site"
            git init -q "$site"
            cd "$site"
            if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
              git fetch -q --depth 1 "$remote" gh-pages
              git checkout -q -B gh-pages FETCH_HEAD
            else
              git checkout -q --orphan gh-pages
            fi

            mkdir -p ranking
            cp "$RUNNER_TEMP"/ranking/{receipts.ndjson,leaderboard.json,log.txt} ranking/
            touch .nojekyll

            git add -A
            if git diff --cached --quiet; then
              echo "gh-pages already holds this ranking."
              exit 0
            fi
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "ranking $GITHUB_SHA"
            if git push -q "$remote" HEAD:gh-pages; then
              exit 0
            fi
            echo "::warning::push attempt $attempt was refused; retrying"
          done
          exit 1
