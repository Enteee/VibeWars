name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every check runs inside the dev shell devenv.nix defines, with the toolchain
# devenv.lock pins: there is no second toolchain setup to drift from it. See
# docs/adr/0021-ci-in-devenv.md.
jobs:
  # The hook list is read from the .pre-commit-config.yaml the shell
  # generates, so adding a hook to `git-hooks.hooks` in devenv.nix adds a CI
  # job for it with no edit here.
  hook-list:
    name: list git hooks
    runs-on: ubuntu-latest
    outputs:
      hooks: ${{ steps.list.outputs.hooks }}
    steps:
      - uses: actions/checkout@v4

      # The one job that saves the Nix store cache. The hook jobs wait for
      # it, so they restore the store this one realised.
      - uses: ./.github/actions/devenv
        with:
          save-cache: "true"

      - id: list
        name: List enabled hooks
        # Asks prek, the runner the hook jobs use, rather than parsing the
        # file: it reads the config exactly as `prek run` will. Written to a
        # file because the shell's own greeting also goes to stdout.
        run: |
          devenv shell -- bash -c \
            "prek list -c .pre-commit-config.yaml --output-format json > '$RUNNER_TEMP/hooks.json'"
          hooks=$(jq -c '[.[].id]' "$RUNNER_TEMP/hooks.json")
          echo "Hooks: $hooks"
          if [ "$(jq length <<<"$hooks")" -eq 0 ]; then
            echo "::error::.pre-commit-config.yaml lists no hooks"
            exit 1
          fi
          echo "hooks=$hooks" >> "$GITHUB_OUTPUT"

  hook:
    name: hook (${{ matrix.hook }})
    needs: hook-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook: ${{ fromJSON(needs.hook-list.outputs.hooks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv

      # Against the whole tree, not only changed files: a commit made with
      # --no-verify, or outside the shell, is caught here.
      - name: Run ${{ matrix.hook }} on every file
        run: >-
          devenv shell --
          prek run "${{ matrix.hook }}"
          --all-files --show-diff-on-failure
          -c .pre-commit-config.yaml

  # One check that is green only if every hook job was. A matrix has no fixed
  # job names to require, so this is the name branch protection can require.
  hooks:
    name: git hooks
    needs: [hook-list, hook]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every hook passed
        env:
          LIST: ${{ needs.hook-list.result }}
          HOOKS: ${{ needs.hook.result }}
        run: |
          echo "hook-list: $LIST, hook: $HOOKS"
          [ "$LIST" = success ] && [ "$HOOKS" = success ]

  # The job name is the required status check (scripts/bots/company-init.mjs
  # EXPECTED_CHECKS), so it stays as it is although e2e now runs here too.
  # No `needs:` on purpose: a required check whose dependency failed is
  # reported as skipped, and a skipped required check counts as passing.
  ci:
    name: format + lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv

      # Mirrors `enterTest` in devenv.nix; keep the two lists in step. They
      # run as discrete steps, not one `devenv test`, so a failure's exact
      # stage is visible directly in the Actions UI. The order is enterTest's:
      # `pnpm run lint` builds the declarations type-aware linting needs
      # itself, and e2e needs the built client, so it goes last.
      - name: Format check
        run: devenv shell -- pnpm run format:check

      - name: Lint
        run: devenv shell -- pnpm run lint

      - name: Typecheck
        run: devenv shell -- pnpm run typecheck

      - name: Test
        run: devenv shell -- pnpm run test

      - name: Build
        run: devenv shell -- pnpm run build

      # Drives the Chromium the shell pins (VIBEWARS_CHROMIUM), so there is
      # no `playwright install`.
      - name: End-to-end tests
        run: devenv shell -- pnpm run test:e2e

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
