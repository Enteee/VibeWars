packages:
  - "apps/*"
  - "packages/*"

# Keep the store deterministic and surface accidental phantom dependencies.
linkWorkspacePackages: true
saveWorkspaceProtocol: rolling
strictPeerDependencies: false

# Supply-chain hardening (#107): don't resolve a version younger than a
# week, don't let a transitive dependency come from git or a tarball URL,
# and refuse a version published with weaker provenance than its predecessor.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade

# Temporary (#107): rolldown@1.2.15 is already in the lockfile on main but was
# published Oct 21, so `pnpm add` re-resolution trips minimumReleaseAge until
# Oct 28. Exactly this version, nothing else. Remove on/after Oct 28.
minimumReleaseAgeExclude:
  - rolldown@1.2.15
