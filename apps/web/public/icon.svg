<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="vibewars">
  <title>vibewars</title>
  <!--
    "Target Lock" — the product icon.

    Built from the two primitives the brief leads with (§20): `player = circle`
    inside `target = ring`. It depicts the core verb of a match rather than a
    map or a profession, so it stays true as content changes around it.

    Colours are the shipped client tokens only (see `src/styles.css` and
    `src/render/arena-scene.ts`); nothing here is a new brand colour:
      #0e1116  bg token      the arena field
      #2b3440  line token    hairline edge
      #ffd866  TARGET_RING   the targeting ring
      #59c2ff  accent token  the player circle

    The dark plate is deliberate: target gold has too little contrast on a
    white ground, so the icon carries its own field the way the viewport does
    and sits correctly on both light and dark tab bars.
  -->

  <!-- Field. -->
  <rect width="64" height="64" rx="14" fill="#0e1116"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="#2b3440" stroke-width="1.5"/>

  <!--
    Targeting ring. Circumference is 2*pi*19 = 119.3805, split into four equal
    dash+gap units of 29.8451 (dash 21 + gap 8.845). The 10.5 offset centres a
    dash at 3 o'clock; rotating -45deg then lands the four gaps on the cardinal
    axes, which keeps the ring reading as an overlay rather than a badge.
  -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffd866" stroke-width="3.6"
          stroke-dasharray="21 8.845" stroke-dashoffset="10.5"
          transform="rotate(-45 32 32)"/>

  <!-- Player. -->
  <circle cx="32" cy="32" r="8" fill="#59c2ff"/>
</svg>
