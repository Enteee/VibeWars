name: perf bench

# The 2.5D perf bench on GitHub-hosted runners (#3368, Q80): render ratio
# (still and walking), the per-frame 2.5D pass costs and the host tick of a
# 4v4 bot match, per map. Information, never a gate: it fails only if a bench
# crashes (the render bench's own ratio ceilings stay in ci.yml). Not an
# expected check.
# Read the table: the run's job summary, or `hub run view <id> --log`
# between the lines `--- perf table ---` and `--- end ---`.

on:
  pull_request:
    paths:
      - apps/web/src/render/**
      - packages/game-core/src/match/simulation.ts
      - packages/game-core/src/match/layer-rules.ts
      - packages/game-core/src/match/pathing.ts
      - packages/game-maps/maps/**
      - scripts/bench/**
      - scripts/ci/perf-plan.mjs
      - .github/workflows/perf-bench.yml
  workflow_dispatch:
    inputs:
      maps:
        description: Map ids, comma separated, or layered (every map of more than one layer)
        required: true
        default: layered

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      maps: ${{ steps.plan.outputs.maps }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MAPS: ${{ inputs.maps }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            maps=$(node scripts/ci/perf-plan.mjs "$BASE" "$HEAD" | jq -r '.maps | join(",")')
          elif [ "$MAPS" = layered ]; then
            maps=$(for f in packages/game-maps/maps/*/map.json; do
              [ "$(jq .layers "$f")" -gt 1 ] && basename "$(dirname "$f")"
            done | paste -sd, -)
          else
            maps=$MAPS
          fi
          case "$maps" in '' | *[!a-z0-9,-]*) echo "bad map list: $maps" >&2; exit 1 ;; esac
          for id in ${maps//,/ }; do
            [ -f "packages/game-maps/maps/$id/map.json" ] || { echo "no such map: $id" >&2; exit 1; }
          done
          echo "maps=$maps" >> "$GITHUB_OUTPUT"
          { echo "## Plan"; echo; echo "$maps" | tr ',' '\n' | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/devenv

      # The client imports the workspace packages by their built output.
      - name: Build packages
        run: devenv shell -- pnpm exec tsc --build tsconfig.build.json

      # Still and walking, the render ratio against the calibration map and
      # the per-frame pass costs. A ratio breach is printed, not failed: ci.yml
      # enforces the ceilings, and the table must reach the report either way.
      # A crash (a map that does not load) still fails the step.
      - name: Render bench
        env:
          BENCH_REPORT_ONLY: "1"
          BENCH_MAP: ${{ needs.plan.outputs.maps }}
        run: |
          set -o pipefail
          devenv shell -- pnpm run bench:render | tee render.log
          sed 's/\x1b\[[0-9;]*m//g' render.log | grep '^|\|^$' > render.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-render
          path: render.md

  host:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/devenv

      - name: Build packages
        run: devenv shell -- pnpm exec tsc --build tsconfig.build.json

      # A 4v4 of bots, 400 ticks, as the host steps it.
      - name: Host tick
        env:
          BENCH_HOST: ${{ needs.plan.outputs.maps }}
        run: |
          set -o pipefail
          BENCH_TICKS=400 devenv shell -- pnpm exec vitest run packages/game-maps/src/map-bench.test.ts -t "times 400" | tee host.log
          {
            echo "| host tick (4v4, 400 ticks) | p50 ms | p95 ms | max ms |"
            echo "|---|---|---|---|"
            sed 's/\x1b\[[0-9;]*m//g' host.log | sed -n 's/^ *host \([^,]*\), ticks [^:]*: p50 \([0-9.]*\) ms, p95 \([0-9.]*\) ms, max \([0-9.]*\) ms.*/| \1 | \2 | \3 | \4 |/p'
          } > host.md
          [ "$(wc -l < host.md)" -gt 2 ] || { echo "no host rows" >&2; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-host
          path: host.md

  report:
    needs: [render, host]
    if: ${{ !cancelled() && needs.render.result == 'success' && needs.host.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: perf-*
          path: parts

      - name: Join
        run: |
          { cat parts/perf-render/render.md; echo; cat parts/perf-host/host.md; } > perf-table.md
          { echo "## Perf table"; echo; cat perf-table.md; } >> "$GITHUB_STEP_SUMMARY"
          echo "--- perf table ---"
          cat perf-table.md
          echo "--- end ---"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-table.md
          path: perf-table.md
