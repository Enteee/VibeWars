name: devenv
description: >-
  Nix, the devenv CLI pinned by devenv.lock, and the dev shell realised from
  devenv.nix, with the Nix store and the pnpm store restored from cache.
  See docs/adr/0021-ci-in-devenv.md.

inputs:
  save-cache:
    description: >-
      Save the Nix store cache at the end of the job. Every job realises the
      same shell, so one job saving it is enough; the rest only restore.
    default: "false"

runs:
  using: composite
  steps:
    # Single-user Nix with a store the runner owns: cache-nix-action restores
    # the store with tar as the runner user, and cannot write into the
    # root-owned store a multi-user install (cachix/install-nix-action) makes.
    # Third-party actions are pinned to a commit, not a movable tag.
    - uses: nixbuild/nix-quick-install-action@5bb6a3b3abe66fd09bbf250dce8ada94f856a703 # v30

    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml', 'nix/**') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        save: ${{ inputs.save-cache }}
        # Drop what the shell no longer references before saving, so an old
        # store does not ride along in every cache generation.
        gc-max-store-size-linux: 8G

    # The agent tooling (claude-code, bubblewrap, tmux, hub, tg, board) stays
    # out of CI's shell; see vibewars.claudeBot.enable in nix/claude-bot.nix.
    # devenv.local.nix is gitignored, so this never reaches a checkout.
    - name: Leave the agent tooling out of the shell
      shell: bash
      run: |
        printf '%s\n' '{ vibewars.claudeBot.enable = false; }' > devenv.local.nix

    # The CLI comes from the same nixpkgs revision devenv.lock pins, so the
    # CLI and the devenv modules it evaluates move together on `devenv update`.
    - name: Install devenv
      shell: bash
      run: |
        rev=$(jq -r .nodes.nixpkgs.locked.rev devenv.lock)
        # Substituting into the restored store now and then dies on a chmod
        # of an existing path ("Operation not permitted"); retry rather than
        # fail the job.
        for attempt in 1 2 3; do
          nix profile install "github:cachix/devenv-nixpkgs/$rev#devenv" && break
          [ "$attempt" = 3 ] && exit 1
          echo "::warning::nix profile install failed (attempt $attempt of 3), retrying"
          sleep 5
        done
        devenv version

    - name: Point pnpm at a cacheable store
      shell: bash
      run: echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/pnpm-store
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    # Realises the shell, writes .pre-commit-config.yaml and runs
    # `pnpm install` (frozen, because CI=true), all once, up front, so the
    # first real check is not charged for it.
    - name: Enter the dev shell
      shell: bash
      run: devenv shell -- true
