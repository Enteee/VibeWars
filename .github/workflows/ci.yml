name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: format + lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run as discrete steps, not one `pnpm run ci`, so a failure's exact
      # stage is visible directly in the GitHub Actions UI rather than buried
      # in one combined log.
      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # After Typecheck, not before, and this order is load-bearing rather
      # than cosmetic. Type-aware linting resolves cross-package imports
      # through each package's `types` entry, which points into `dist/` —
      # gitignored, so a fresh checkout has none. Linting first made every
      # cross-package symbol `error`-typed and produced ~966 bogus
      # `no-unsafe-*` errors, while passing on any machine where an earlier
      # build had left `dist/` behind. `tsc --build` in Typecheck emits those
      # declarations.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
