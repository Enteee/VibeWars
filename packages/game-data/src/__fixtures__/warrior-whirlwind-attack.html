});
$(document).on('click', 'div.item', function () {
    window.location.href = $(this).data('tags');
});
function togglePlay(id, e) {
    const audio = document.getElementById(id);
    if (audio.paused) { audio.play(); e.className = 'far fa-pause-circle'; }
    else { audio.pause(); e.className = 'far fa-play-circle'; }
    audio.addEventListener('ended', () => { e.className = 'far fa-play-circle'; });
}
