name: CodeQL

# GitHub code scanning for JavaScript and TypeScript: apps/*, packages/* and
# scripts/bots/*.mjs (#175). Alerts land in the Security tab and as
# annotations on the pull request that introduces them. The company's nine
# roles read them with `hub alerts [--pr N]` (#184, not a later support role);
# perf-sec-qa triages them, and the manager files an issue per real one.
#
# Advisory, and it must stay unable to fail a pull request: hubd refuses a
# merge unless every job of this workflow's pull_request run succeeded
# (EVERY_JOB_WORKFLOWS in hubd.mjs). Two check runs appear, and both are
# neutralised:
#
# - these jobs: `continue-on-error` on the CodeQL steps, so an extraction or
#   upload failure concludes as success rather than blocking unrelated work;
# - code scanning's own `CodeQL` check run, which fails on new alerts by
#   default. The repository setting Settings → Code security → Code
#   scanning → Protection rules → Check run failure threshold must be
#   **None** for both security and standard alerts. A fresh repository needs
#   it set by hand before this workflow runs on a pull request.
#
# Not in EXPECTED_CHECKS. Making it a gate is a follow-up once a couple of
# weeks of alerts show the false-positive rate.
#
# No devenv and no install: JS/TS extraction needs neither, so nothing from
# the pull request's package.json runs here.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the scan it supersedes, so stale
# scans stop holding runners. Every other trigger is keyed on its own run, as
# a ref-keyed group would drop an intermediate merge's scan on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze
    runs-on: ${{ (vars.COMPANY_RUNNERS == '1' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('["self-hosted","vibewars-company"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      # `upload: never`: the scan runs on a company runner, which holds no
      # write token. The `upload` job sends the SARIF from a hosted runner.
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        with:
          category: /language:javascript-typescript
          upload: never
          output: sarif

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarif-javascript-typescript
          path: sarif
          retention-days: 1
          if-no-files-found: ignore

  # Hosted, with the only write permission of this workflow. No checkout, no
  # `run:` step, nothing from the artifact is executed (ADR-0045 amendment).
  # Every step is `continue-on-error`: this job is de facto required (hubd's
  # EVERY_JOB_WORKFLOWS), and a failed scan leaves no SARIF to download or
  # upload; a fork PR has no write token and fails into the same success.
  upload:
    name: upload
    needs: analyze
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: sarif-javascript-typescript
          path: sarif

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        with:
          sarif_file: sarif
          category: /language:javascript-typescript
