name: CodeQL

# GitHub code scanning for JavaScript and TypeScript: apps/*, packages/* and
# scripts/bots/*.mjs (#175). Alerts land in the Security tab and as
# annotations on the pull request that introduces them. Only the operator
# can see them until hub can read code scanning alerts (#184). Then
# perf-sec-qa triages them and files an issue for each real one (see
# SECURITY.md).
#
# Advisory, and it must stay unable to fail a pull request: hubd refuses a
# merge while any check on the head is failing or pending, required or not
# (see audit.yml). Two check runs appear, and both are neutralised:
#
# - this job: `continue-on-error` on the CodeQL steps, so an extraction or
#   upload failure concludes as success rather than blocking unrelated work;
# - code scanning's own `CodeQL` check run, which fails on new alerts by
#   default. The repository setting Settings → Code security → Code
#   scanning → Protection rules → Check run failure threshold must be
#   **None** for both security and standard alerts. A fresh repository needs
#   it set by hand before this workflow runs on a pull request.
#
# Not in EXPECTED_CHECKS. Making it a gate is a follow-up once a couple of
# weeks of alerts show the false-positive rate.
#
# No devenv and no install: JS/TS extraction needs neither, so nothing from
# the pull request's package.json runs here.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        with:
          category: /language:javascript-typescript
